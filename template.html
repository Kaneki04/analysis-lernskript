<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analysis – Mein Lernskript</title><meta name="description" content="Analysis: Geometrische Reihen, Teleskopsummen, Quotientenkriterium, L'Hospital und Taylor-Reihen."><style>:root{color-scheme:light dark;--bg:#f7f7f5;--paper:#fff;--text:#22272d;--muted:#68717c;--line:#e4e6e8;--accent:#335d92;--result:#176347;--result-bg:#edf6ef;--sidebar:#f0f1ee;--shadow:0 1px 2px #172a4510} @media(prefers-color-scheme:dark){:root{--bg:#121417;--paper:#1a1e24;--text:#e9ebef;--muted:#a5aebc;--line:#333b45;--accent:#9dc2fb;--result:#a2dfb6;--result-bg:#1c3028;--sidebar:#161a20;--shadow:none}} [data-theme=light]{color-scheme:light;--bg:#f7f7f5;--paper:#fff;--text:#22272d;--muted:#68717c;--line:#e4e6e8;--accent:#335d92;--result:#176347;--result-bg:#edf6ef;--sidebar:#f0f1ee;--shadow:0 1px 2px #172a4510} [data-theme=dark]{color-scheme:dark;--bg:#121417;--paper:#1a1e24;--text:#e9ebef;--muted:#a5aebc;--line:#333b45;--accent:#9dc2fb;--result:#a2dfb6;--result-bg:#1c3028;--sidebar:#161a20;--shadow:none} *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:22px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}a{color:var(--accent)}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;padding:26px 19px;background:var(--sidebar);border-right:1px solid var(--line);overflow:auto}.brand{font-size:1.15rem;font-weight:750;letter-spacing:-.03em}.meta{color:var(--muted);font-size:.78rem;margin:2px 0 25px}.nav-label,.eyebrow,.result-label{font-size:.68rem;letter-spacing:.14em;font-weight:750;color:var(--muted)}nav{display:grid;gap:5px;margin:9px 0 20px}nav a{display:block;text-decoration:none;color:var(--muted);font-size:.91rem;padding:10px;border-radius:8px;line-height:1.35}nav a:hover,nav a.active{color:var(--accent);background:var(--paper);box-shadow:var(--shadow)}.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:1px solid var(--line);border-radius:7px;color:var(--text);background:var(--paper);padding:8px 10px;font:inherit;font-size:.8rem;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.main{margin-left:260px;padding:48px clamp(18px,4vw,70px) 70px;max-width:1300px}main{max-width:850px;margin:auto}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;letter-spacing:-.055em;margin:0 0 8px}.subtitle{font-size:.95rem;color:var(--muted);margin:0 0 28px}.chapter{background:var(--paper);padding:clamp(20px,4vw,38px);margin:28px 0;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.chapter-head{border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:22px}h2{font-size:clamp(1.4rem,3vw,1.85rem);letter-spacing:-.035em;line-height:1.23;margin:5px 0 0}h3{font-size:1.16rem;letter-spacing:-.015em;line-height:1.4;margin:31px 0 11px;color:var(--accent)}h4{font-size:1rem;margin:22px 0 8px}p{margin:10px 0 15px;overflow-wrap:break-word}.equation{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:17px 12px;margin:10px 0;overflow-x:auto;text-align:center;line-height:1.25;font-size:1.09rem}.equation mjx-container[display=true]{display:block;min-width:max-content;margin:0!important}.equation svg{max-width:none}.equation.result{background:var(--result-bg);border-color:color-mix(in srgb,var(--result) 22%,transparent);color:var(--result);padding:13px 12px 17px}.result-label{display:block;color:var(--result);text-align:left;margin:0 0 11px 4px}mjx-container{display:inline-block;line-height:0;vertical-align:middle}mjx-container>svg{overflow:visible}mjx-container svg svg{overflow:hidden}p mjx-container svg{max-width:100%}.source{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px;margin-top:25px}.mobile-nav{display:none}.footer{font-size:.82rem;color:var(--muted);text-align:center;margin:30px 0}.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:var(--paper);z-index:9;padding:10px}@media(max-width:780px){.sidebar{position:static;width:auto;padding:15px 18px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}.sidebar nav{display:flex;overflow-x:auto;gap:6px;margin:8px 0;scrollbar-width:thin}.sidebar nav a{white-space:nowrap;font-size:.81rem;padding:8px;background:var(--paper)}.sidebar .meta{margin:1px 0 8px}.sidebar .nav-label{display:none}.actions{margin:8px 0 0}.main{margin-left:0;padding:28px 13px 45px}.chapter{padding:19px 15px;margin:20px 0}.equation{font-size:1rem;padding:14px 8px}h3{margin-top:25px}}@media print{.sidebar,.footer,.skip{display:none}.main{margin:0;padding:0}.chapter{border:0;box-shadow:none;padding:0;break-before:page;margin:0}.equation{break-inside:avoid;border:0}.result{border:1px solid #ccc!important}body{background:white;color:black;font-size:11pt}h3{break-after:avoid}h1,h2,h3{color:black}}</style></head><body><a class="skip" href="#content">Zum Lernskript</a><aside class="sidebar"><div class="brand">Analysis</div><div class="meta">Mein Lernskript · Prüfungsvorbereitung</div><div class="nav-label">KAPITEL</div><nav aria-label="Kapitel">{{NAV}}</nav><div class="actions"><button id="theme" type="button">Hell / Dunkel</button><button id="print" type="button">Drucken / PDF</button></div></aside><div class="main"><main id="content">{{CONTENT}}</main></div><script>const root=document.documentElement;try{const t=localStorage.getItem('analysis-theme');if(t)root.dataset.theme=t}catch{}document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('analysis-theme',root.dataset.theme)}catch{}};document.getElementById('print').onclick=()=>window.print();const links=[...document.querySelectorAll('nav a')];const chapters=[...document.querySelectorAll('.chapter')];const active=()=>{let idx=0;for(let i=0;i<chapters.length;i++)if(chapters[i].getBoundingClientRect().top<150)idx=i;links.forEach((a,i)=>a.classList.toggle('active',i===idx))};window.addEventListener('scroll',active,{passive:true});active();</script></body></html>
