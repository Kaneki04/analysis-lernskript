<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Analysis – Mein Lernskript</title><meta name="description" content="Analysis: Geometrische Reihen, Teleskopsummen, Quotientenkriterium, L'Hospital und Taylor-Reihen."><style>:root{color-scheme:light dark;--bg:#f7f7f5;--paper:#fff;--text:#22272d;--muted:#68717c;--line:#e4e6e8;--accent:#335d92;--result:#176347;--result-bg:#edf6ef;--sidebar:#f0f1ee;--shadow:0 1px 2px #172a4510} @media(prefers-color-scheme:dark){:root{--bg:#121417;--paper:#1a1e24;--text:#e9ebef;--muted:#a5aebc;--line:#333b45;--accent:#9dc2fb;--result:#a2dfb6;--result-bg:#1c3028;--sidebar:#161a20;--shadow:none}} [data-theme=light]{color-scheme:light;--bg:#f7f7f5;--paper:#fff;--text:#22272d;--muted:#68717c;--line:#e4e6e8;--accent:#335d92;--result:#176347;--result-bg:#edf6ef;--sidebar:#f0f1ee;--shadow:0 1px 2px #172a4510} [data-theme=dark]{color-scheme:dark;--bg:#121417;--paper:#1a1e24;--text:#e9ebef;--muted:#a5aebc;--line:#333b45;--accent:#9dc2fb;--result:#a2dfb6;--result-bg:#1c3028;--sidebar:#161a20;--shadow:none} *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:22px}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}a{color:var(--accent)}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;padding:26px 19px;background:var(--sidebar);border-right:1px solid var(--line);overflow:auto}.brand{font-size:1.15rem;font-weight:750;letter-spacing:-.03em}.meta{color:var(--muted);font-size:.78rem;margin:2px 0 25px}.nav-label,.eyebrow,.result-label{font-size:.68rem;letter-spacing:.14em;font-weight:750;color:var(--muted)}nav{display:grid;gap:5px;margin:9px 0 20px}nav a{display:block;text-decoration:none;color:var(--muted);font-size:.91rem;padding:10px;border-radius:8px;line-height:1.35}nav a:hover,nav a.active{color:var(--accent);background:var(--paper);box-shadow:var(--shadow)}.action :absolute;left:-999px}.skip:focus{left:10px;top:10px;background:var(--paper);z-index:9;padding:10px}@media(max-width:780px){.sidebar{position:static;width:auto;padding:15px 18px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}.sidebar nav{display:flex;overflow-x:auto;gap:6px;margin:8px 0;scrollbar-width:thin}.sidebar nav a{white-space:nowrap;font-size:.81rem;padding:8px;background:var(--paper)}.sidebar .meta{margin:1px 0 8px}.sidebar .nav-label{display:none}.actions{margin:8px 0 0}.main{margin-left:0;padding:28px 13px 45px}.chapter{padding:19px 15px;margin:20px 0}.equation{font-size:1rem;padding:14px 8px}h3{margin-top:25px}}@media print{.sidebar,.footer,.skip{display:none}.main{margin:0;padding:0}.chapter{border:0;box-shadow:none;padding:0;break-before:page;margin:0}.equation{break-inside:avoid;border:0}.result{border:1px solid #ccc!important}body{background:white;color:black;font-size:11pt}h3{break-after:avoid}h1,h2,h3{color:black}}

</style></head><body><a class="skip" href="#content">Zum Lernskript</a><aside class="sidebar"><div class="brand">Analysis</div><div class="meta">Mein Lernskript · Prüfungsvorbereitung</div><div class="nav-label">KAPITEL</div><nav aria-label="Kapitel">{{NAV}}</nav><div class="actions"><button id="formula-mode" type="button" aria-pressed="false">Nur allgemeine Formeln</button><button id="theme" type="button">Hell / Dunkel</button><button id="print" type="button">Drucken / PDF</button></div></aside><div class="main"><main id="content">{{CONTENT}}</main></div><script>const root=document.documentElement;try{const t=localStorage.getItem('analysis-theme');if(t)root.dataset.theme=t}catch{}document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('analysis-theme',root.dataset.theme)}catch{}};document.getElementById('print').onclick=()=>window.print();const links=[...document.querySelectorAll('nav a')];const chapters=[...document.querySelectorAll('.chapter')];const active=()=>{let idx=0;for(let i=0;i<chapters.length;i++)if(chapters[i].getBoundingClientRect().top<150)idx=i;links.forEach((a,i)=>a.classList.toggle('active',i===idx))};window.addEventListener('scroll',active,{passive:true});active();const toggle=document.getElementById('formula-mode');toggle.onclick=()=>{const enabled=root.classList.toggle('formula-only');toggle.setAttribute('aria-pressed',String(enabled));toggle.textContent=enabled?'Vollständiges Lernskript':'Nur allgemeine Formeln';active();markOverflow()};function markOverflow(){document.querySelectorAll('.equation').forEach(e=>{if(e.scrollWidth>e.clientWidth+2)e.setAttribute('tabindex','0');else e.removeAttribute('tabindex')})}window.addEventListener('resize',markOverflow);markOverflow();</script></body></html>
